name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # PRs from qa/* branches: fast smoke check — mocked API, frontend only
  smoke:
    name: Smoke Tests
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'qa/')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install dependencies
      run: |
        npm ci
        npm ci --prefix frontend
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run smoke tests
      run: npx playwright test --config playwright.smoke.config.ts
      env:
        CI: 'true'
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: smoke-report
        path: smoke-report/
        retention-days: 7

  # Pushes to main/master, or PRs from non-qa branches (e.g. develop): full suite against real backend
  test:
    name: Full Tests
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'qa/'))
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flight_tracker
          POSTGRES_PASSWORD: flight_tracker
          POSTGRES_DB: flight_tracker
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['6379:6379']
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Check AeroDataBox key
      run: |
        [ -n "$AERODATABOX_KEY" ] || { echo "::error::AERODATABOX_KEY secret is not set"; exit 1; }
      env:
        AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
    - name: Install dependencies
      run: |
        npm ci
        npm ci --prefix backend
        npm ci --prefix frontend
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        CI: 'true'
        DATABASE_URL: postgresql://flight_tracker:flight_tracker@localhost:5432/flight_tracker
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        FRONTEND_URL: http://localhost:3000
        AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
        ADSB_CONTACT: ${{ vars.ADSB_CONTACT }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
