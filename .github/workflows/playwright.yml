name: Playwright Tests
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ develop ]

jobs:
  # PRs from qa/* to develop: fast smoke check — mocked API, frontend only
  smoke:
    name: Smoke Tests
    if: >
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'qa/')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install dependencies
      run: |
        npm ci
        npm ci --prefix frontend
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run smoke tests
      run: npx playwright test --config playwright.smoke.config.ts
      env:
        CI: 'true'
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: smoke-report
        path: smoke-report/
        retention-days: 7

  # PRs from feature/dev branches to develop: full suite against real backend
  test-pr:
    name: Full Tests (PR)
    if: >
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'qa/')
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flight_tracker
          POSTGRES_PASSWORD: flight_tracker
          POSTGRES_DB: flight_tracker
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['6379:6379']
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Check AeroDataBox key
      run: |
        [ -n "$AERODATABOX_KEY" ] || { echo "::error::AERODATABOX_KEY secret is not set"; exit 1; }
      env:
        AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
    - name: Install dependencies
      run: |
        npm ci
        npm ci --prefix backend
        npm ci --prefix frontend
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        CI: 'true'
        DATABASE_URL: postgresql://flight_tracker:flight_tracker@localhost:5432/flight_tracker
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        FRONTEND_URL: http://localhost:3000
        AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
        ADSB_CONTACT: ${{ vars.ADSB_CONTACT }}
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  # Post-merge to main: run only the user-story API specs that landed in this merge
  test-post-merge:
    name: Feature API Tests (post-merge)
    if: github.event_name == 'push'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flight_tracker
          POSTGRES_PASSWORD: flight_tracker
          POSTGRES_DB: flight_tracker
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['6379:6379']
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 2
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Identify user-story from merge commit and locate QA specs
      id: changed
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
      run: |
        # Merge commit message contains the PR branch, e.g.:
        #   “Merge pull request #N from user/feature/us-011-user-login”
        # Extract the first us-NNN pattern (case-insensitive).
        story=$(echo “$COMMIT_MSG” | grep -oiP 'us-\d+' | head -1 | tr '[:upper:]' '[:lower:]')
        if [ -n “$story” ]; then
          echo “Detected user story: $story”
          files=$(find tests/specs -name “${story}-*.spec.ts” 2>/dev/null | tr '\n' ' ')
        fi
        # Fallback: if no story ID found in message, check for any spec changes in the merge
        if [ -z “$files” ]; then
          files=$(git diff HEAD~1 --name-only -- 'tests/specs/us-*.spec.ts' | tr '\n' ' ')
        fi
        echo “files=$files” >> $GITHUB_OUTPUT
        if [ -n “$files” ]; then
          echo “Running specs: $files”
        else
          echo “No user-story specs found — skipping”
        fi
    - name: Check AeroDataBox key
      if: steps.changed.outputs.files != ''
      run: |
        [ -n "$AERODATABOX_KEY" ] || { echo "::error::AERODATABOX_KEY secret is not set"; exit 1; }
      env:
        AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
    - name: Install dependencies
      if: steps.changed.outputs.files != ''
      run: |
        npm ci
        npm ci --prefix backend
        npm ci --prefix frontend
    - name: Install Playwright Browsers
      if: steps.changed.outputs.files != ''
      run: npx playwright install --with-deps
    - name: Run user-story API tests against real backend
      if: steps.changed.outputs.files != ''
      run: npx playwright test ${{ steps.changed.outputs.files }}
      env:
        CI: 'true'
        DATABASE_URL: postgresql://flight_tracker:flight_tracker@localhost:5432/flight_tracker
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        FRONTEND_URL: http://localhost:3000
        AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
        ADSB_CONTACT: ${{ vars.ADSB_CONTACT }}
    - uses: actions/upload-artifact@v6
      if: steps.changed.outputs.files != '' && always()
      with:
        name: feature-api-report
        path: playwright-report/
        retention-days: 30
