name: PR — Story API Tests

# Runs on every PR targeting develop.
# Finds user stories changed in this PR, runs their committed spec file.
# This is the required status check for PR merge — set in branch protection:
#   "PR — Story API Tests / story-api-tests"
#
# If a changed story has no committed spec, a notice is posted and the job
# passes (the developer should run /qa-orchestrator-ui <story-id> locally
# to generate one and commit it before merging).
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      backend_mode:
        description: 'Backend to run specs against'
        required: false
        default: 'real'
        type: choice
        options:
          - real
          - mock

concurrency:
  group: pr-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  story-api-tests:
    name: Story API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flight_tracker
          POSTGRES_PASSWORD: flight_tracker
          POSTGRES_DB: flight_tracker
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            apps/qa-api-orchestrator/package-lock.json

      - name: Install backend dependencies
        if: inputs.backend_mode != 'mock'
        run: npm ci
        working-directory: backend

      - name: Install orchestrator dependencies
        run: npm ci
        working-directory: apps/qa-api-orchestrator

      - name: Build backend
        if: inputs.backend_mode != 'mock'
        run: npm run build
        working-directory: backend

      - name: Start backend
        if: inputs.backend_mode != 'mock'
        run: node dist/main &
        working-directory: backend
        env:
          PORT: 3100
          DATABASE_URL: postgresql://flight_tracker:flight_tracker@localhost:5432/flight_tracker
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
          ADSB_CONTACT: ${{ vars.ADSB_CONTACT }}
          COLLECT_AIRPORTS: ''

      - name: Wait for backend to be ready
        if: inputs.backend_mode != 'mock'
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3100/health > /dev/null 2>&1; then
              echo "Backend ready after ${i} attempts"; exit 0
            fi
            echo "  attempt $i/30 — retrying in 2 s"; sleep 2
          done
          echo "ERROR: backend did not become ready within 60 s"; exit 1

      - name: Start mock API server
        if: inputs.backend_mode == 'mock'
        working-directory: apps/qa-api-orchestrator
        run: |
          npm run mock &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3199/health > /dev/null 2>&1; then
              echo "Mock server ready after ${i} attempts"; exit 0
            fi
            echo "  attempt $i/15 — retrying in 1 s"; sleep 1
          done
          echo "ERROR: mock server did not become ready within 15 s"; exit 1

      - name: Detect changed user stories and locate specs
        id: changed
        run: |
          SPEC_DIR="apps/qa-api-orchestrator/tests/generated"
          # Compare this PR's head to the base branch
          DIFF=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$DIFF"

          # Extract US-NNN identifiers from any changed path
          STORIES=$(echo "$DIFF" | grep -oE 'US-[0-9]+' | tr '[:upper:]' '[:lower:]' | sort -u | tr '\n' ' ' | xargs)
          echo "Changed stories: ${STORIES:-none}"

          SPEC_LIST=""
          MISSING=""
          for s in $STORIES; do
            spec="${SPEC_DIR}/${s}.spec.ts"
            if [ -f "$spec" ]; then
              SPEC_LIST="${SPEC_LIST} ${spec}"
              echo "  ✅ Found spec: $spec"
            else
              MISSING="${MISSING} ${s^^}"
              echo "::notice title=Missing spec for ${s^^}::No committed spec found for ${s^^}. Run '/qa-orchestrator-ui ${s^^}' locally and commit the generated file to include it in CI."
            fi
          done

          echo "spec_list=${SPEC_LIST}" >> $GITHUB_OUTPUT
          echo "missing=${MISSING}"     >> $GITHUB_OUTPUT

          if [ -z "$STORIES" ]; then
            echo "::notice::No user story changes detected in this PR — skipping API spec run."
          fi

      - name: Run story specs (initial)
        id: run_specs
        if: steps.changed.outputs.spec_list != ''
        working-directory: apps/qa-api-orchestrator
        run: |
          mkdir -p reports
          echo "Running specs: ${{ steps.changed.outputs.spec_list }}"
          if npx playwright test ${{ steps.changed.outputs.spec_list }} \
              --config playwright.config.ts \
              --output=reports/pr-results; then
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "status=fail" >> $GITHUB_OUTPUT
          fi
        env:
          API_BASE_URL: ${{ inputs.backend_mode == 'mock' && 'http://localhost:3199' || 'http://localhost:3100' }}

      - name: Analyse and heal failures
        id: heal
        if: steps.run_specs.outputs.status == 'fail'
        continue-on-error: true
        working-directory: apps/qa-api-orchestrator
        run: npm run ci-heal

      - name: Re-run after healing
        if: steps.run_specs.outputs.status == 'fail' && steps.heal.outcome == 'success'
        working-directory: apps/qa-api-orchestrator
        run: |
          echo "Re-running specs after auto-healing..."
          npx playwright test ${{ steps.changed.outputs.spec_list }} \
            --config playwright.config.ts \
            --output=reports/pr-results-healed
        env:
          API_BASE_URL: ${{ inputs.backend_mode == 'mock' && 'http://localhost:3199' || 'http://localhost:3100' }}

      - name: Fail if not auto-healable
        if: steps.run_specs.outputs.status == 'fail' && steps.heal.outcome != 'success'
        run: |
          echo "::error::API specs failed and could not be auto-healed."
          echo "::error::See apps/qa-api-orchestrator/reports/heal-summary.json for failure classification."
          exit 1

      - name: Skip message when no specs found
        if: steps.changed.outputs.spec_list == ''
        run: |
          echo "No committed specs for the stories changed in this PR."
          echo "Generate and commit specs locally with: /qa-orchestrator-ui <US-NNN>"

      - name: Upload PR spec results
        uses: actions/upload-artifact@v4
        if: always() && steps.changed.outputs.spec_list != ''
        with:
          name: pr-api-results
          path: apps/qa-api-orchestrator/reports/
          retention-days: 7
